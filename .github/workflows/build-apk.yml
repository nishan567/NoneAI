name: Build Nonea AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Locate Project Root & Ensure Gradle Wrapper
        run: |
          # 1. Automatically find directory containing settings.gradle.kts or build.gradle.kts
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Detected project root directory at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          # 2. Navigate to project root
          cd "$PROJECT_DIR"

          # 3. If gradlew is missing, automatically generate it using runner Gradle
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in repository. Generating Gradle 8.4 wrapper..."
            gradle wrapper --gradle-version 8.4
          fi

          # 4. Ensure execute permissions on the wrapper script
          chmod +x gradlew

      - name: Build Debug APK with Build Scan
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug \
            --scan \
            -Dscan.termsOfServiceUrl="https://gradle.com/terms-of-service" \
            -Dscan.termsOfServiceAgree=yes \
            --no-daemon \
            --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoneaAI-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
