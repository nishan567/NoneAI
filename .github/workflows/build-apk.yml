name: Build Nonea AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate Project & Generate Gradle 8.7 Wrapper
        run: |
          # 1. Find root containing settings.gradle.kts
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "Detected project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd "$PROJECT_DIR"
          # AGP 8.5.2 requires Gradle 8.7+
          echo "Configuring Gradle 8.7 wrapper for AGP 8.5.2..."
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace -x test

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoneaAI-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
