name: Build Nonea AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        working-directory: sample_projects/NoneaAI
        run: |
          echo "Building inside directory: $(pwd)"
          # Generate Gradle 8.7 wrapper
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          # Compile Debug APK
          ./gradlew assembleDebug --no-daemon --stacktrace -x test --no-build-cache

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoneaAI-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
